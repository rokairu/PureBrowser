name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK components
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head -20
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || echo "sdkmanager install issue, continuing with preinstalled SDK"
          else
            echo "sdkmanager not on PATH, relying on preinstalled SDK"
            ls "$ANDROID_HOME/build-tools" || true
            ls "$ANDROID_HOME/platforms" || true
          fi

      - name: Download Gradle 8.11.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: purebrowser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: "Latest build"
          files: app/build/outputs/apk/debug/app-debug.apk
